<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0f0f12"><title>ZdrapSe — nie myśl, zdrap</title><style>
:root{--bg:#0f0f12;--surface:#17171c;--surface2:#202027;--text:#f7f5ef;--muted:#a6a3ad;--acid:#c9ff38;--orange:#ff5b2e;--violet:#8f6bff;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(circle at 18% 0%,rgba(143,107,255,.18),transparent 28%),radial-gradient(circle at 90% 15%,rgba(255,91,46,.13),transparent 25%),#0f0f12}.app{width:min(100%,560px);min-height:100dvh;margin:auto;padding:18px 18px 28px;display:flex;flex-direction:column;position:relative}.top{display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:900;letter-spacing:-1.2px}.logo-mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--acid),#fff48a);display:grid;place-items:center;color:#111;font-size:15px;transform:rotate(-6deg);box-shadow:0 8px 24px rgba(201,255,56,.14)}.beta{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:.8px;color:#cfcbd5}.hero{padding:42px 0 24px}.eyebrow{font-size:12px;font-weight:800;color:var(--acid);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}.hero h1{font-size:clamp(47px,13vw,78px);line-height:.92;letter-spacing:-4.5px;margin:0;font-weight:950;max-width:500px}.hero h1 span{display:inline-block;background:linear-gradient(100deg,#fff 5%,#c8c5d1 85%);-webkit-background-clip:text;background-clip:text;color:transparent}.intro{font-size:17px;line-height:1.45;color:var(--muted);max-width:430px;margin:17px 0 0}.intro strong{color:#fff}.card-shell{position:relative;padding:1px;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.02));box-shadow:0 24px 80px rgba(0,0,0,.34)}.scratch-wrap{position:relative;width:100%;aspect-ratio:1.45;border-radius:29px;overflow:hidden;background:#fff;transition:transform .22s ease,box-shadow .22s ease}.scratch-wrap.done{transform:translateY(-2px);box-shadow:0 18px 60px rgba(201,255,56,.12)}.fortune{position:absolute;inset:0;padding:30px 25px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;background:linear-gradient(145deg,#c9ff38 0%,#ddff7f 100%);color:#111}.category{font-size:10px;font-weight:900;letter-spacing:2px;margin-bottom:14px;padding:7px 9px;border-radius:999px;background:rgba(17,17,17,.08)}.fortune-text{font-size:clamp(24px,6.5vw,37px);line-height:1.03;font-weight:900;letter-spacing:-1.7px;max-width:95%}.stamp{position:absolute;right:18px;bottom:14px;font-size:11px;font-weight:900;opacity:.45}.scratch-wrap:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:3}.under-card{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 4px 0}.hint{font-size:11px;font-weight:800;letter-spacing:.8px;color:#d6d3db;text-transform:uppercase}.progress{width:110px;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--orange));transition:width .08s}.actions{display:none;gap:10px;margin-top:18px}.actions.show{display:grid;grid-template-columns:1.25fr .95fr;animation:up .24s ease-out}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.btn{appearance:none;border:0;border-radius:17px;font:inherit;font-weight:850;font-size:15px;padding:16px 14px;cursor:pointer;transition:transform .12s ease,filter .12s ease}.btn:active{transform:scale(.98)}.btn.primary{background:linear-gradient(135deg,var(--acid),#efffa8);color:#0f0f12}.btn.secondary{background:var(--surface2);color:#fff;border:1px solid var(--line)}.footer-note{margin-top:auto;padding-top:28px;display:flex;justify-content:space-between;gap:18px;font-size:11px;color:#6f6b78}.flake{position:fixed;z-index:99;pointer-events:none;border-radius:50%;background:#a9afb7;box-shadow:0 0 1px #555;animation:flake .55s ease-out forwards}@keyframes flake{to{transform:translate(var(--dx),var(--dy)) rotate(160deg);opacity:0}}.pop{position:fixed;z-index:100;pointer-events:none;font-size:23px;font-weight:bold;animation:pop .8s ease-out forwards}@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}@media(max-width:430px){.app{padding-left:14px;padding-right:14px}.hero{padding-top:34px}.hero h1{letter-spacing:-3.8px}.scratch-wrap{aspect-ratio:1.3}.actions.show{grid-template-columns:1fr}.under-card{align-items:flex-start;flex-direction:column;gap:9px}.progress{width:100%}}
</style></head><body><main class="app"><div class="top"><div class="logo"><div class="logo-mark">✦</div><div>ZdrapSe</div></div><div class="beta">ABSURD / BETA</div></div><section class="hero"><div class="eyebrow">Los już coś wymyślił</div><h1><span>Nie myśl.</span><br>Zdrap.</h1><p class="intro">Masz pytanie? Nie masz pytania? <strong>Bez znaczenia.</strong> Przejedź palcem i zrzuć odpowiedzialność na kawałek internetu.</p></section><div class="card-shell"><section class="scratch-wrap" id="card"><div class="fortune"><div class="category" id="category"></div><div class="fortune-text" id="fortune"></div><div class="stamp">ZDRAPSE</div></div><canvas id="scratch"></canvas></section></div><div class="under-card" id="hint"><div class="hint">Przejedź palcem po zdrapce</div><div class="progress"><i id="bar"></i></div></div><div class="actions" id="actions"><button class="btn primary" id="again">Jeszcze raz</button><button class="btn secondary" id="share">Wyślij komuś</button></div><div class="footer-note" id="counter"><span>bez logowania</span><span>bez sensu, za to szybko</span></div></main><script>
const fortunes=[['WRÓŻBA','Dzisiaj podejmiesz świetną decyzję. Niestety dopiero po dwóch fatalnych.'],['ZNAK OD LOSU','To jest ten znak, na który czekałeś. Problem w tym, że nie wiemy do czego.'],['PRAWDA','Nie potrzebujesz motywacji. Potrzebujesz przestać negocjować sam ze sobą.'],['WRÓŻBA','Ktoś dziś o Tobie pomyśli. Oby nie urząd skarbowy.'],['ZNAK OD LOSU','Zrób to. Jeśli nie wiesz co — tym bardziej brzmi ciekawie.'],['PRAWDA','Masz więcej czasu, niż Ci się wydaje. I mniej, niż planujesz zmarnować.'],['WRÓŻBA','Dziś trafisz na coś przypadkiem. Udawaj, że tak miało być.'],['ZNAK OD LOSU','Napisz do tej osoby. Tak, do tej. Nie, nie potrzebujesz lepszego powodu.'],['PRAWDA','To, że dobrze brzmi w Twojej głowie, nie znaczy jeszcze, że jest dobrym pomysłem.'],['WRÓŻBA','Mały sukces jest blisko. Wielki też, tylko ma gorszy dojazd.'],['ZNAK OD LOSU','Odpuść jedną rzecz, którą robisz tylko dlatego, że „wypada”.'],['PRAWDA','Nie wszystko trzeba ogarniać. Czasem wystarczy nie pogorszyć.'],['PRAWDA','Ta rzecz, którą odkładasz? Nadal tam jest. Pozdrawia.'],['WRÓŻBA','Wieczorem będziesz mądrzejszy. Pytanie tylko, o jakie błędy.'],['ZNAK OD LOSU','Kup sobie coś dobrego do jedzenia. Los wyjątkowo ma dziś sens.'],['PRAWDA','Nie jesteś zmęczony życiem. Jesteś zmęczony tym jednym konkretnym gównem.'],['WRÓŻBA','Dzisiaj ktoś powie „a nie mówiłem”. Możliwe, że będziesz to Ty.'],['ZNAK OD LOSU','Jeśli wahasz się między tak i nie, rzuć monetą. Jak się wkurzysz na wynik, już wiesz.']];
const REVEAL_AT=.46;const canvas=document.getElementById('scratch'),ctx=canvas.getContext('2d',{willReadFrequently:true}),card=document.getElementById('card'),fortuneEl=document.getElementById('fortune'),categoryEl=document.getElementById('category'),actions=document.getElementById('actions'),hint=document.getElementById('hint'),counter=document.getElementById('counter'),bar=document.getElementById('bar');let drawing=false,last=null,revealed=false,count=0,current=null,moves=0;function fit(){const r=card.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0)}function pick(){let n;do{n=fortunes[Math.floor(Math.random()*fortunes.length)]}while(current&&n[1]===current[1]);current=n;categoryEl.textContent=n[0];fortuneEl.textContent=n[1]}function coat(){const r=card.getBoundingClientRect();ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,r.width,r.height);let g=ctx.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#747a81');g.addColorStop(.15,'#d8dbe0');g.addColorStop(.42,'#969ca3');g.addColorStop(.72,'#eef0f2');g.addColorStop(1,'#858b91');ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);for(let i=0;i<360;i++){let a=Math.random()*.22+.04;ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(Math.random()*r.width,Math.random()*r.height,Math.random()*3+1,Math.random()*1.4+.4)}ctx.fillStyle='rgba(15,15,18,.78)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 18px system-ui';ctx.fillText('ZDRAP SE',r.width/2,r.height/2-8);ctx.font='800 10px system-ui';ctx.fillText('TU JEST TWOJA WĄTPLIWA ODPOWIEDŹ',r.width/2,r.height/2+17);ctx.globalCompositeOperation='destination-out'}function reset(){revealed=false;drawing=false;last=null;moves=0;actions.classList.remove('show');card.classList.remove('done');hint.style.display='flex';bar.style.width='0';pick();fit();coat()}function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function flake(x,y){if(Math.random()>.55)return;let r=canvas.getBoundingClientRect();for(let i=0;i<2;i++){let f=document.createElement('i');f.className='flake';let s=Math.random()*4+2;f.style.width=s+'px';f.style.height=(s*.55)+'px';f.style.left=(r.left+x)+'px';f.style.top=(r.top+y)+'px';f.style.setProperty('--dx',((Math.random()-.5)*38)+'px');f.style.setProperty('--dy',(Math.random()*34+12)+'px');document.body.appendChild(f);setTimeout(()=>f.remove(),600)}}function scratch(a,b){ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=40;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,20,0,Math.PI*2);ctx.fill();flake(b.x,b.y)}function percent(){const d=ctx.getImageData(0,0,canvas.width,canvas.height).data;let clear=0,total=0;for(let i=3;i<d.length;i+=160){total++;if(d[i]<40)clear++}return clear/total}function check(){if(++moves%4)return;let p=percent();bar.style.width=Math.min(100,p/REVEAL_AT*100)+'%';if(p>REVEAL_AT)reveal()}function reveal(){if(revealed)return;revealed=true;ctx.clearRect(0,0,canvas.width,canvas.height);card.classList.add('done');actions.classList.add('show');hint.style.display='none';count++;counter.innerHTML=count===1?'<span>Pierwsza poszła.</span><span>Przypadek? Oczywiście.</span>':'<span>Zdrapane: '+count+'</span><span>Samokontrola: dyskusyjna.</span>';burst()}canvas.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);scratch(last,last)});canvas.addEventListener('pointermove',e=>{if(!drawing||revealed)return;let p=pos(e);scratch(last,p);last=p;check()});canvas.addEventListener('pointerup',()=>{drawing=false;last=null;if(!revealed&&percent()>REVEAL_AT)reveal()});canvas.addEventListener('pointercancel',()=>{drawing=false;last=null});window.addEventListener('resize',()=>{if(!revealed){fit();coat()}});document.getElementById('again').onclick=reset;document.getElementById('share').onclick=async()=>{let text='ZdrapSe powiedziało mi: „'+current[1]+'”\n\nSprawdź, co los ma do Ciebie.';try{if(navigator.share)await navigator.share({title:'ZdrapSe',text,url:location.href});else{await navigator.clipboard.writeText(text+' '+location.href);alert('Skopiowane. Teraz podrzuć komuś ten problem.')}}catch(e){}};function burst(){let chars=['✦','★','●','✹','✷'],r=card.getBoundingClientRect();for(let i=0;i<16;i++){let s=document.createElement('span');s.className='pop';s.textContent=chars[Math.floor(Math.random()*chars.length)];s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',((Math.random()-.5)*280)+'px');s.style.setProperty('--y',((Math.random()-.75)*280)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}reset();</script></body></html>
