<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ff4d00"><title>ZdrapSe — los wie lepiej</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f8efd8;color:#141414}body{min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}.app{width:min(100%,520px);min-height:100dvh;padding:20px 17px 30px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:35px;font-weight:1000;letter-spacing:-2.5px;transform:rotate(-2deg)}.logo b{color:#ff4b00}.pill{font-size:10px;font-weight:1000;border:2px solid #141414;border-radius:999px;padding:7px 9px;background:#baff3f;transform:rotate(2deg)}h1{font-size:clamp(39px,11vw,64px);line-height:.89;letter-spacing:-3.6px;margin:37px 0 12px;font-weight:1000;text-transform:uppercase}.intro{font-size:17px;line-height:1.35;margin:0 0 23px;max-width:410px}.scratch-wrap{position:relative;width:100%;aspect-ratio:1.45;border:3px solid #141414;border-radius:26px;overflow:hidden;box-shadow:8px 8px 0 #141414;background:#fff;transition:transform .22s}.scratch-wrap.done{transform:rotate(-1deg) scale(1.015)}.fortune{position:absolute;inset:0;padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#baff3f}.category{font-size:10px;font-weight:1000;letter-spacing:2px;margin-bottom:14px}.fortune-text{font-size:clamp(23px,6.4vw,35px);line-height:1.02;font-weight:1000;letter-spacing:-1.5px}.stamp{position:absolute;right:13px;bottom:10px;font-size:10px;font-weight:1000;transform:rotate(-8deg);opacity:.5}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.hint{text-align:center;font-size:12px;font-weight:1000;margin:16px 0 0;letter-spacing:.5px}.progress{height:5px;background:#ded4bd;border-radius:10px;margin:10px auto 0;width:120px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#ff4b00;transition:width .08s}.actions{display:none;gap:10px;margin-top:21px}.actions.show{display:grid;animation:up .25s ease-out}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.btn{appearance:none;border:3px solid #141414;border-radius:16px;background:#ff4b00;color:#fff;font:inherit;font-weight:1000;font-size:17px;padding:15px 14px;box-shadow:4px 4px 0 #141414;cursor:pointer}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #141414}.btn.secondary{background:#fff;color:#141414}.counter{margin-top:auto;padding-top:30px;text-align:center;font-size:11px;font-weight:900;opacity:.5}.flake{position:fixed;z-index:99;pointer-events:none;border-radius:50%;background:#9ba0a4;box-shadow:0 0 1px #555;animation:flake .55s ease-out forwards}@keyframes flake{to{transform:translate(var(--dx),var(--dy)) rotate(160deg);opacity:0}}.pop{position:fixed;z-index:100;pointer-events:none;font-size:23px;font-weight:bold;animation:pop .8s ease-out forwards}@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}@media(max-width:380px){.app{padding-left:13px;padding-right:13px}h1{margin-top:29px}.scratch-wrap{aspect-ratio:1.3}}</style></head><body><main class="app"><div class="top"><div class="logo">ZDRAP<b>SE</b></div><div class="pill">LOS WIE LEPIEJ*</div></div><h1>Nie myśl.<br>Zdrap.</h1><p class="intro">Masz pytanie? Nie masz pytania? <strong>Bez znaczenia.</strong> Los już coś sobie wymyślił.</p><section class="scratch-wrap" id="card"><div class="fortune"><div class="category" id="category"></div><div class="fortune-text" id="fortune"></div><div class="stamp">ZDRAPSE</div></div><canvas id="scratch"></canvas></section><div class="hint" id="hint">PRZEJEDŹ PALCEM. RESZTĘ ZWAL NA LOS.<div class="progress"><i id="bar"></i></div></div><div class="actions" id="actions"><button class="btn" id="again">NO DOBRA, JESZCZE RAZ</button><button class="btn secondary" id="share">WYŚLIJ TO KOMUŚ</button></div><div class="counter" id="counter">*nie wie. ale brzmi pewnie.</div></main><script>
const fortunes=[['WRÓŻBA','Dzisiaj podejmiesz świetną decyzję. Niestety dopiero po dwóch fatalnych.'],['ZNAK OD LOSU','To jest ten znak, na który czekałeś. Problem w tym, że nie wiemy do czego.'],['PRAWDA','Nie potrzebujesz motywacji. Potrzebujesz przestać negocjować sam ze sobą.'],['WRÓŻBA','Ktoś dziś o Tobie pomyśli. Oby nie urząd skarbowy.'],['ZNAK OD LOSU','Zrób to. Jeśli nie wiesz co — tym bardziej brzmi ciekawie.'],['PRAWDA','Masz więcej czasu, niż Ci się wydaje. I mniej, niż planujesz zmarnować.'],['WRÓŻBA','Dziś trafisz na coś przypadkiem. Udawaj, że tak miało być.'],['ZNAK OD LOSU','Napisz do tej osoby. Tak, do tej. Nie, nie potrzebujesz lepszego powodu.'],['PRAWDA','To, że dobrze brzmi w Twojej głowie, nie znaczy jeszcze, że jest dobrym pomysłem.'],['WRÓŻBA','Mały sukces jest blisko. Wielki też, tylko ma gorszy dojazd.'],['ZNAK OD LOSU','Odpuść jedną rzecz, którą robisz tylko dlatego, że „wypada”.'],['PRAWDA','Nie wszystko trzeba ogarniać. Czasem wystarczy nie pogorszyć.'],['PRAWDA','Ta rzecz, którą odkładasz? Nadal tam jest. Pozdrawia.'],['WRÓŻBA','Wieczorem będziesz mądrzejszy. Pytanie tylko, o jakie błędy.'],['ZNAK OD LOSU','Kup sobie coś dobrego do jedzenia. Los wyjątkowo ma dziś sens.'],['PRAWDA','Nie jesteś zmęczony życiem. Jesteś zmęczony tym jednym konkretnym gównem.'],['WRÓŻBA','Dzisiaj ktoś powie „a nie mówiłem”. Możliwe, że będziesz to Ty.'],['ZNAK OD LOSU','Jeśli wahasz się między tak i nie, rzuć monetą. Jak się wkurzysz na wynik, już wiesz.']];
const REVEAL_AT=.56;const canvas=document.getElementById('scratch'),ctx=canvas.getContext('2d',{willReadFrequently:true}),card=document.getElementById('card'),fortuneEl=document.getElementById('fortune'),categoryEl=document.getElementById('category'),actions=document.getElementById('actions'),hint=document.getElementById('hint'),counter=document.getElementById('counter'),bar=document.getElementById('bar');let drawing=false,last=null,revealed=false,count=0,current=null,moves=0;function fit(){const r=card.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0)}function pick(){let n;do{n=fortunes[Math.floor(Math.random()*fortunes.length)]}while(current&&n[1]===current[1]);current=n;categoryEl.textContent=n[0];fortuneEl.textContent=n[1]}function coat(){const r=card.getBoundingClientRect();ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,r.width,r.height);let g=ctx.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#8e9498');g.addColorStop(.18,'#d7dadd');g.addColorStop(.5,'#a9aeb2');g.addColorStop(.78,'#eceeef');g.addColorStop(1,'#92979b');ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);for(let i=0;i<300;i++){let a=Math.random()*.22+.04;ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(Math.random()*r.width,Math.random()*r.height,Math.random()*3+1,Math.random()*1.5+.4)}ctx.fillStyle='#202020';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='1000 20px Arial';ctx.fillText('ZDRAP SE',r.width/2,r.height/2-9);ctx.font='800 10px Arial';ctx.fillText('NIE GWARANTUJEMY NICZEGO',r.width/2,r.height/2+17);ctx.globalCompositeOperation='destination-out'}function reset(){revealed=false;drawing=false;last=null;moves=0;actions.classList.remove('show');card.classList.remove('done');hint.style.display='block';bar.style.width='0';pick();fit();coat()}function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function flake(x,y){if(Math.random()>.55)return;let r=canvas.getBoundingClientRect();for(let i=0;i<2;i++){let f=document.createElement('i');f.className='flake';let s=Math.random()*4+2;f.style.width=s+'px';f.style.height=(s*.55)+'px';f.style.left=(r.left+x)+'px';f.style.top=(r.top+y)+'px';f.style.setProperty('--dx',((Math.random()-.5)*38)+'px');f.style.setProperty('--dy',(Math.random()*34+12)+'px');document.body.appendChild(f);setTimeout(()=>f.remove(),600)}}function scratch(a,b){ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=31;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,15.5,0,Math.PI*2);ctx.fill();flake(b.x,b.y)}function percent(){const d=ctx.getImageData(0,0,canvas.width,canvas.height).data;let clear=0,total=0;for(let i=3;i<d.length;i+=160){total++;if(d[i]<40)clear++}return clear/total}function check(){if(++moves%4)return;let p=percent();bar.style.width=Math.min(100,p/REVEAL_AT*100)+'%';if(p>REVEAL_AT)reveal()}function reveal(){if(revealed)return;revealed=true;ctx.clearRect(0,0,canvas.width,canvas.height);card.classList.add('done');actions.classList.add('show');hint.style.display='none';count++;counter.textContent=count===1?'Pierwsza poszła. Przypadek? Oczywiście.':'Zdrapane: '+count+'. Samokontrola: dyskusyjna.';burst()}canvas.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);scratch(last,last)});canvas.addEventListener('pointermove',e=>{if(!drawing||revealed)return;let p=pos(e);scratch(last,p);last=p;check()});canvas.addEventListener('pointerup',()=>{drawing=false;last=null;if(!revealed&&percent()>REVEAL_AT)reveal()});canvas.addEventListener('pointercancel',()=>{drawing=false;last=null});window.addEventListener('resize',()=>{if(!revealed){fit();coat()}});document.getElementById('again').onclick=reset;document.getElementById('share').onclick=async()=>{let text='ZdrapSe powiedziało mi: „'+current[1]+'”\n\nSprawdź, co los ma do Ciebie.';try{if(navigator.share)await navigator.share({title:'ZdrapSe',text,url:location.href});else{await navigator.clipboard.writeText(text+' '+location.href);alert('Skopiowane. Teraz podrzuć komuś ten problem.')}}catch(e){}};function burst(){let chars=['✦','★','●','✹','✷'],r=card.getBoundingClientRect();for(let i=0;i<16;i++){let s=document.createElement('span');s.className='pop';s.textContent=chars[Math.floor(Math.random()*chars.length)];s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',((Math.random()-.5)*280)+'px');s.style.setProperty('--y',((Math.random()-.75)*280)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}reset();</script></body></html>
