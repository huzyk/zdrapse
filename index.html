<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4efe7" id="themeMeta"><title>ZdrapSe — nie myśl, zdrap</title><style>:root{--bg:#f4efe7;--bg2:#fffaf2;--ink:#121212;--blue:#3157ff;--pink:#ff5ca8;--lemon:#f4ff6a;--muted:#6f6b66;--panel:#fff;--shadow:#3157ff}body.dark{--bg:#0f0f12;--bg2:#0f0f12;--ink:#f7f5ef;--blue:#8f6bff;--pink:#ff5b2e;--lemon:#c9ff38;--muted:#a6a3ad;--panel:#202027;--shadow:#8f6bff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{min-height:100dvh;overflow-x:hidden;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}body.dark{background:radial-gradient(circle at 18% 0%,rgba(143,107,255,.18),transparent 28%),radial-gradient(circle at 90% 15%,rgba(255,91,46,.13),transparent 25%),#0f0f12}.app{width:min(100%,560px);min-height:100dvh;margin:auto;padding:18px 18px 30px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:26px;font-weight:950;letter-spacing:-1.5px}.top-actions{display:flex;gap:8px;align-items:center}.theme-toggle{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:50%;background:var(--panel);color:var(--ink);font-size:17px;display:grid;place-items:center;cursor:pointer}.beta{font-size:10px;font-weight:900;letter-spacing:1px;padding:7px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--lemon);color:#121212}.hero{padding:36px 0 22px}.kicker{font-size:12px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;color:var(--blue);margin-bottom:11px}.hero h1{font-size:clamp(50px,14vw,82px);line-height:.88;letter-spacing:-5px;margin:0;font-weight:950}.hero h1 em{font-style:normal;color:var(--pink)}.intro{font-size:17px;line-height:1.45;color:var(--muted);max-width:430px;margin:18px 0 0}.intro strong{color:var(--ink)}.card-shell{position:relative;border:2px solid var(--ink);border-radius:30px;box-shadow:10px 10px 0 var(--shadow);background:var(--panel)}.scratch-wrap{position:relative;width:100%;aspect-ratio:1.45;border-radius:27px;overflow:hidden;background:var(--panel)}.scratch-wrap.done{transform:rotate(-1deg) translateY(-2px)}.fortune{position:absolute;inset:0;padding:30px 26px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;background:var(--lemon);color:#121212}.category{font-size:10px;font-weight:900;letter-spacing:2px;margin-bottom:14px;padding:7px 9px;border:1.5px solid #121212;border-radius:999px;background:#fff}.fortune-text{font-size:clamp(24px,6.6vw,37px);line-height:1.02;font-weight:950;letter-spacing:-1.7px;max-width:95%}.stamp{position:absolute;right:18px;bottom:14px;font-size:11px;font-weight:900;color:#3157ff}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:3}.under-card{padding:15px 3px 0;font-size:11px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}.actions{display:none;gap:10px;margin-top:18px}.actions.show{display:grid;grid-template-columns:1.2fr 1fr}.btn{appearance:none;border:2px solid var(--ink);border-radius:16px;font:inherit;font-weight:900;font-size:15px;padding:16px 14px;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}.btn.primary{background:var(--pink);color:#121212}.btn.secondary{background:var(--panel);color:var(--ink)}.footer-note{margin-top:auto;padding-top:30px;display:flex;justify-content:space-between;gap:18px;font-size:11px;color:var(--muted)}.flake{position:fixed;z-index:99;pointer-events:none;border-radius:50%;background:#aaa;animation:flake .55s ease-out forwards}@keyframes flake{to{transform:translate(var(--dx),var(--dy)) rotate(160deg);opacity:0}}.pop{position:fixed;z-index:100;pointer-events:none;font-size:23px;font-weight:bold;animation:pop .8s ease-out forwards}@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}@media(max-width:430px){.app{padding-left:14px;padding-right:14px}.hero{padding-top:30px}.hero h1{letter-spacing:-4px}.scratch-wrap{aspect-ratio:1.3}.actions.show{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div class="logo">ZdrapSe</div><div class="top-actions"><button class="theme-toggle" id="themeToggle" aria-label="Zmień motyw">☾</button><div class="beta">BETA / ABSURD</div></div></div><section class="hero"><div class="kicker">Los już coś wymyślił</div><h1>Nie myśl.<br><em>Zdrap.</em></h1><p class="intro">Masz pytanie? Nie masz pytania? <strong>Bez znaczenia.</strong> Przejedź palcem i zrzuć odpowiedzialność na kawałek internetu.</p></section><div class="card-shell"><section class="scratch-wrap" id="card"><div class="fortune"><div class="category" id="category"></div><div class="fortune-text" id="fortune"></div><div class="stamp">ZDRAPSE</div></div><canvas id="scratch"></canvas></section></div><div class="under-card" id="hint">Ładuję los...</div><div class="actions" id="actions"><button class="btn primary" id="again">Jeszcze raz</button><button class="btn secondary" id="share">Wyślij komuś</button></div><div class="footer-note" id="counter"><span>bez logowania</span><span>bez sensu, za to szybko</span></div></main><script>
let fortunes=[];const fallback=[{kategoria:'ZNAK OD LOSU',tekst:'Los chwilowo zgubił bazę tekstów. Spróbuj odświeżyć stronę.',waga:1}];
function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);const headers=lines.shift().split(';').map(x=>x.trim().toLowerCase());return lines.map(line=>{const cols=line.split(';');const o={};headers.forEach((h,i)=>o[h]=(cols[i]??'').trim());o.waga=Math.max(1,parseInt(o.waga||'1',10)||1);return o}).filter(o=>o.tekst&&String(o.aktywny).toUpperCase()!=='NIE')}
async function loadFortunes(){try{const r=await fetch('teksty.csv?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();fortunes=parseCSV(await r.text());if(!fortunes.length)throw new Error()}catch(e){fortunes=fallback}reset()}
function weightedPick(){const pool=[];fortunes.forEach(f=>{for(let i=0;i<f.waga;i++)pool.push(f)});let n;do{n=pool[Math.floor(Math.random()*pool.length)]}while(current&&pool.length>1&&n.tekst===current.tekst);return n}
const themeToggle=document.getElementById('themeToggle'),themeMeta=document.getElementById('themeMeta');function setTheme(dark){document.body.classList.toggle('dark',dark);themeToggle.textContent=dark?'☀':'☾';themeMeta.content=dark?'#0f0f12':'#f4efe7';localStorage.setItem('zdrapse-theme',dark?'dark':'light')}setTheme(localStorage.getItem('zdrapse-theme')==='dark');themeToggle.onclick=()=>setTheme(!document.body.classList.contains('dark'));
const REVEAL_AT=.46,canvas=document.getElementById('scratch'),ctx=canvas.getContext('2d',{willReadFrequently:true}),card=document.getElementById('card'),fortuneEl=document.getElementById('fortune'),categoryEl=document.getElementById('category'),actions=document.getElementById('actions'),hint=document.getElementById('hint'),counter=document.getElementById('counter');let drawing=false,last=null,revealed=false,count=0,current=null,moves=0;function fit(){const r=card.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0)}function pick(){current=weightedPick();categoryEl.textContent=current.kategoria;fortuneEl.textContent=current.tekst}function coat(){const r=card.getBoundingClientRect();ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,r.width,r.height);let g=ctx.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#777d83');g.addColorStop(.16,'#d9dde0');g.addColorStop(.42,'#999fa5');g.addColorStop(.73,'#eff1f2');g.addColorStop(1,'#858b90');ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);for(let i=0;i<360;i++){let a=Math.random()*.2+.04;ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(Math.random()*r.width,Math.random()*r.height,Math.random()*3+1,Math.random()*1.4+.4)}ctx.fillStyle='rgba(18,18,18,.8)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 18px system-ui';ctx.fillText('ZDRAP SE',r.width/2,r.height/2-8);ctx.font='800 10px system-ui';ctx.fillText('TU JEST TWOJA WĄTPLIWA ODPOWIEDŹ',r.width/2,r.height/2+17);ctx.globalCompositeOperation='destination-out'}function reset(){revealed=false;drawing=false;last=null;moves=0;actions.classList.remove('show');card.classList.remove('done');hint.style.display='block';hint.textContent='Przejedź palcem po zdrapce';pick();fit();coat()}function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function flake(x,y){if(Math.random()>.55)return;let r=canvas.getBoundingClientRect();for(let i=0;i<2;i++){let f=document.createElement('i');f.className='flake';let s=Math.random()*4+2;f.style.width=s+'px';f.style.height=(s*.55)+'px';f.style.left=(r.left+x)+'px';f.style.top=(r.top+y)+'px';f.style.setProperty('--dx',((Math.random()-.5)*38)+'px');f.style.setProperty('--dy',(Math.random()*34+12)+'px');document.body.appendChild(f);setTimeout(()=>f.remove(),600)}}function scratch(a,b){ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=40;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,20,0,Math.PI*2);ctx.fill();flake(b.x,b.y)}function percent(){const d=ctx.getImageData(0,0,canvas.width,canvas.height).data;let clear=0,total=0;for(let i=3;i<d.length;i+=160){total++;if(d[i]<40)clear++}return clear/total}function check(){if(++moves%4)return;if(percent()>REVEAL_AT)reveal()}function reveal(){if(revealed)return;revealed=true;ctx.clearRect(0,0,canvas.width,canvas.height);card.classList.add('done');actions.classList.add('show');hint.style.display='none';count++;counter.innerHTML=count===1?'<span>Pierwsza poszła.</span><span>Przypadek? Oczywiście.</span>':'<span>Zdrapane: '+count+'</span><span>Samokontrola: dyskusyjna.</span>';burst()}canvas.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);scratch(last,last)});canvas.addEventListener('pointermove',e=>{if(!drawing||revealed)return;let p=pos(e);scratch(last,p);last=p;check()});canvas.addEventListener('pointerup',()=>{drawing=false;last=null;if(!revealed&&percent()>REVEAL_AT)reveal()});canvas.addEventListener('pointercancel',()=>{drawing=false;last=null});window.addEventListener('resize',()=>{if(!revealed&&fortunes.length){fit();coat()}});document.getElementById('again').onclick=reset;document.getElementById('share').onclick=async()=>{let text='ZdrapSe powiedziało mi: „'+current.tekst+'”\n\nSprawdź, co los ma do Ciebie.';try{if(navigator.share)await navigator.share({title:'ZdrapSe',text,url:location.href});else{await navigator.clipboard.writeText(text+' '+location.href);alert('Skopiowane. Teraz podrzuć komuś ten problem.')}}catch(e){}};function burst(){let chars=['✦','★','●','✹','✷'],r=card.getBoundingClientRect();for(let i=0;i<16;i++){let s=document.createElement('span');s.className='pop';s.textContent=chars[Math.floor(Math.random()*chars.length)];s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',((Math.random()-.5)*280)+'px');s.style.setProperty('--y',((Math.random()-.75)*280)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}loadFortunes();
</script></body></html>
