<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4efe7"><title>ZdrapSe — nie myśl, zdrap</title><style>:root{--bg:#f4efe7;--ink:#121212;--blue:#3157ff;--pink:#ff5ca8;--lemon:#f4ff6a;--muted:#6f6b66;--panel:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}body{min-height:100dvh}.app{width:min(100%,560px);min-height:100dvh;margin:auto;padding:18px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:950;letter-spacing:-1.5px}.beta{font-size:10px;font-weight:900;padding:7px 10px;border:1.5px solid;border-radius:999px;background:var(--lemon)}.screen{display:none}.screen.active{display:block}.hero{padding:35px 0 20px}.kicker{font-size:11px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;color:var(--blue);margin-bottom:10px}h1{font-size:clamp(46px,13vw,72px);line-height:.9;letter-spacing:-4px;margin:0;font-weight:950}h1 em{font-style:normal;color:var(--pink)}.intro{font-size:16px;line-height:1.4;color:var(--muted);margin:16px 0 0}.choices{display:grid;gap:10px;padding-bottom:30px}.choice{width:100%;text-align:left;border:2px solid var(--ink);border-radius:18px;background:#fff;padding:15px 16px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}.choice:active{transform:translate(2px,2px);box-shadow:2px 2px 0}.choice strong{display:block;font-size:18px;font-weight:950}.choice span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.choice.fate{background:var(--pink)}.choice.adult{background:#1b1b1b;color:#fff}.choice.adult span{color:#bbb}.back{border:0;background:none;padding:20px 0 8px;font-weight:850;cursor:pointer;color:var(--muted)}.selected{font-size:12px;font-weight:900;color:var(--blue);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}.card-shell{position:relative;border:2px solid var(--ink);border-radius:30px;box-shadow:10px 10px 0 var(--blue);background:#fff}.scratch-wrap{position:relative;width:100%;aspect-ratio:1.45;border-radius:27px;overflow:hidden}.fortune{position:absolute;inset:0;padding:30px 26px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:var(--lemon)}.category{font-size:10px;font-weight:900;letter-spacing:2px;margin-bottom:14px;padding:7px 9px;border:1.5px solid;border-radius:999px;background:#fff}.fortune-text{font-size:clamp(24px,6.6vw,37px);line-height:1.02;font-weight:950;letter-spacing:-1.7px}.stamp{position:absolute;right:18px;bottom:14px;font-size:11px;font-weight:900;color:var(--blue)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:3}.hint{padding:15px 3px 0;font-size:11px;font-weight:900;text-transform:uppercase;color:var(--muted)}.actions{display:none;gap:10px;margin-top:18px}.actions.show{display:grid;grid-template-columns:1.2fr 1fr}.btn{border:2px solid;border-radius:16px;background:#fff;font:inherit;font-weight:900;font-size:15px;padding:16px 12px;box-shadow:4px 4px 0;cursor:pointer}.btn.primary{background:var(--pink)}.footer{padding:28px 0 10px;font-size:11px;color:var(--muted);text-align:center}.flake{position:fixed;z-index:99;pointer-events:none;border-radius:50%;background:#aaa;animation:flake .55s ease-out forwards}@keyframes flake{to{transform:translate(var(--dx),var(--dy));opacity:0}}@media(max-width:430px){.app{padding:14px}.scratch-wrap{aspect-ratio:1.3}.actions.show{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div class="logo">ZdrapSe</div><div class="beta">BETA / ABSURD</div></div><section class="screen active" id="home"><div class="hero"><div class="kicker">Wybierz swoje przeznaczenie</div><h1>Na co masz<br><em>ochotę?</em></h1><p class="intro">Możesz wybrać kategorię. Możesz też zrzucić tę odpowiedzialność na los.</p></div><div class="choices"><button class="choice fate" data-cat="LOS"><strong>🎲 ZDAJ SIĘ NA LOS</strong><span>Nie wybieraj. To też jest wybór.</span></button><button class="choice" data-cat="DOBRA RADA"><strong>„DOBRA” RADA</strong><span>Może pomoże. Może zaszkodzi.</span></button><button class="choice" data-cat="MOTYWACJA"><strong>MOTYWACJA</strong><span>Obudź w sobie zwycięzcę. Albo coś.</span></button><button class="choice" data-cat="OBRAŹ MNIE"><strong>OBRAŹ MNIE</strong><span>Skoro prosisz.</span></button><button class="choice" data-cat="POGŁASZCZ MNIE"><strong>POGŁASZCZ MNIE</strong><span>No chodź.</span></button><button class="choice" data-cat="TAK CZY NIE"><strong>TAK CZY NIE</strong><span>Pomyśl pytanie. Nie oszukuj.</span></button><button class="choice adult" data-cat="18+"><strong>🔞 18+</strong><span>Sam chciałeś.</span></button></div></section><section class="screen" id="game"><button class="back" id="back">← Zmień kategorię</button><div class="selected" id="selected"></div><div class="card-shell"><section class="scratch-wrap" id="card"><div class="fortune"><div class="category" id="category"></div><div class="fortune-text" id="fortune"></div><div class="stamp">ZDRAPSE</div></div><canvas id="scratch"></canvas></section></div><div class="hint" id="hint">Przejedź palcem po zdrapce</div><div class="actions" id="actions"><button class="btn primary" id="again">Jeszcze raz</button><button class="btn" id="share">Wyślij komuś</button></div></section><div class="footer">bez logowania • bez sensu, za to szybko</div></main><script>let fortunes=[],selectedCat='LOS',current=null;const fallback=[{kategoria:'DOBRA RADA',tekst:'Odśwież stronę. Los zgubił bazę.',waga:1}];function parseCSV(t){const l=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),h=l.shift().split(';').map(x=>x.trim().toLowerCase());return l.map(line=>{const c=line.split(';'),o={};h.forEach((x,i)=>o[x]=(c[i]||'').trim());o.waga=Math.max(1,parseInt(o.waga||1)||1);return o}).filter(o=>o.tekst&&o.aktywny.toUpperCase()!=='NIE')}async function load(){try{let r=await fetch('teksty.csv?'+Date.now(),{cache:'no-store'});fortunes=parseCSV(await r.text());if(!fortunes.length)throw 0}catch(e){fortunes=fallback}}function pool(){let p=selectedCat==='LOS'?fortunes.filter(x=>x.kategoria!=='18+'):fortunes.filter(x=>x.kategoria===selectedCat);if(!p.length)p=fallback;let w=[];p.forEach(x=>{for(let i=0;i<x.waga;i++)w.push(x)});return w}function pick(){let p=pool(),n;do{n=p[Math.floor(Math.random()*p.length)]}while(current&&p.length>1&&n.tekst===current.tekst);current=n;category.textContent=n.kategoria;fortune.textContent=n.tekst}const home=document.getElementById('home'),game=document.getElementById('game'),canvas=document.getElementById('scratch'),ctx=canvas.getContext('2d',{willReadFrequently:true}),card=document.getElementById('card'),category=document.getElementById('category'),fortune=document.getElementById('fortune'),actions=document.getElementById('actions'),hint=document.getElementById('hint'),selected=document.getElementById('selected');let drawing=false,last=null,revealed=false,moves=0;const REVEAL_AT=.56;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selectedCat=b.dataset.cat;selected.textContent=selectedCat==='LOS'?'Zdaj się na los':selectedCat;home.classList.remove('active');game.classList.add('active');reset();scrollTo(0,0)});back.onclick=()=>{game.classList.remove('active');home.classList.add('active');scrollTo(0,0)};function fit(){let r=card.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}function coat(){let r=card.getBoundingClientRect(),g=ctx.createLinearGradient(0,0,r.width,r.height);ctx.globalCompositeOperation='source-over';g.addColorStop(0,'#777d83');g.addColorStop(.2,'#e0e3e5');g.addColorStop(.5,'#999fa5');g.addColorStop(.8,'#eff1f2');g.addColorStop(1,'#858b90');ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);ctx.fillStyle='#222';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 18px system-ui';ctx.fillText('ZDRAP SE',r.width/2,r.height/2-8);ctx.font='800 10px system-ui';ctx.fillText('TU JEST TWOJA WĄTPLIWA ODPOWIEDŹ',r.width/2,r.height/2+17);ctx.globalCompositeOperation='destination-out'}function reset(){revealed=false;moves=0;actions.classList.remove('show');hint.style.display='block';pick();requestAnimationFrame(()=>{fit();coat()})}function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function scratch(a,b){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=40;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,20,0,Math.PI*2);ctx.fill();flake(b.x,b.y)}function pct(){let d=ctx.getImageData(0,0,canvas.width,canvas.height).data,c=0,n=0;for(let i=3;i<d.length;i+=160){n++;if(d[i]<40)c++}return c/n}function check(){if(++moves%4)return;if(pct()>REVEAL_AT)reveal()}function reveal(){if(revealed)return;revealed=true;ctx.clearRect(0,0,canvas.width,canvas.height);actions.classList.add('show');hint.style.display='none'}function flake(x,y){if(Math.random()>.6)return;let r=canvas.getBoundingClientRect(),f=document.createElement('i');f.className='flake';f.style.width=f.style.height=(Math.random()*4+2)+'px';f.style.left=r.left+x+'px';f.style.top=r.top+y+'px';f.style.setProperty('--dx',(Math.random()-.5)*35+'px');f.style.setProperty('--dy',Math.random()*30+10+'px');document.body.appendChild(f);setTimeout(()=>f.remove(),600)}canvas.onpointerdown=e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);scratch(last,last)};canvas.onpointermove=e=>{if(!drawing||revealed)return;let p=pos(e);scratch(last,p);last=p;check()};canvas.onpointerup=()=>{drawing=false;if(!revealed&&pct()>REVEAL_AT)reveal()};again.onclick=reset;share.onclick=async()=>{let t='ZdrapSe: „'+current.tekst+'”';try{if(navigator.share)await navigator.share({title:'ZdrapSe',text:t,url:location.href});else await navigator.clipboard.writeText(t+' '+location.href)}catch(e){}};load();</script></body></html>
