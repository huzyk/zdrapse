<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#ff4d00" />
  <title>ZdrapSe — zdrap i zobacz</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff4dc;color:#171717}body{min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}.app{width:min(100%,520px);min-height:100dvh;padding:22px 18px 34px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:34px;font-weight:1000;letter-spacing:-2px;transform:rotate(-2deg)}.logo b{color:#ff4d00}.pill{font-size:11px;font-weight:900;border:2px solid #171717;border-radius:999px;padding:7px 10px;background:#b8ff45;transform:rotate(2deg)}h1{font-size:clamp(36px,10vw,62px);line-height:.92;letter-spacing:-3px;margin:42px 0 12px;font-weight:1000;text-transform:uppercase}.intro{font-size:17px;line-height:1.35;max-width:390px;margin:0 0 25px}.scratch-wrap{position:relative;width:100%;aspect-ratio:1.55;border:3px solid #171717;border-radius:25px;overflow:hidden;box-shadow:8px 8px 0 #171717;background:#fff}.fortune{position:absolute;inset:0;padding:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#b8ff45}.category{text-transform:uppercase;font-size:11px;font-weight:1000;letter-spacing:1.5px;margin-bottom:15px}.fortune-text{font-size:clamp(23px,6vw,34px);line-height:1.05;font-weight:1000;letter-spacing:-1.4px}.fortune small{margin-top:18px;font-size:12px;font-weight:800;opacity:.65}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.hint{text-align:center;font-size:13px;font-weight:900;margin:16px 0 0}.actions{display:none;gap:10px;margin-top:22px}.actions.show{display:grid}.btn{appearance:none;border:3px solid #171717;border-radius:16px;background:#ff4d00;color:white;font:inherit;font-weight:1000;font-size:17px;padding:15px 14px;box-shadow:4px 4px 0 #171717;cursor:pointer}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #171717}.btn.secondary{background:#fff;color:#171717}.counter{margin-top:auto;padding-top:35px;text-align:center;font-size:12px;font-weight:800;opacity:.55}.confetti{position:fixed;pointer-events:none;font-size:24px;animation:pop .8s ease-out forwards}@keyframes pop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}@media(max-width:380px){.app{padding-left:14px;padding-right:14px}h1{margin-top:30px}.scratch-wrap{aspect-ratio:1.35}}
  </style>
</head>
<body>
<main class="app">
  <div class="top"><div class="logo">ZDRAP<b>SE</b></div><div class="pill">NIE PYTAJ PO CO</div></div>
  <h1>Los coś<br>do ciebie ma.</h1>
  <p class="intro">Nie wiemy co. On też pewnie nie. <strong>Zdrap i sprawdź.</strong></p>
  <section class="scratch-wrap" id="card">
    <div class="fortune"><div class="category" id="category"></div><div class="fortune-text" id="fortune"></div><small>zdrapse</small></div>
    <canvas id="scratch"></canvas>
  </section>
  <div class="hint" id="hint">☝️ ZDRAP SZARE POLE</div>
  <div class="actions" id="actions">
    <button class="btn" id="again">ZDRAP JESZCZE</button>
    <button class="btn secondary" id="share">WYŚLIJ KOMUŚ LOS</button>
  </div>
  <div class="counter" id="counter"></div>
</main>
<script>
const fortunes=[
['WRÓŻBA','Dzisiaj podejmiesz świetną decyzję. Niestety dopiero po dwóch fatalnych.'],
['ZNAK OD LOSU','To jest ten znak, na który czekałeś. Problem w tym, że nie wiemy do czego.'],
['PRAWDA','Nie potrzebujesz motywacji. Potrzebujesz przestać negocjować sam ze sobą.'],
['WRÓŻBA','Ktoś dziś o Tobie pomyśli. Oby nie urząd skarbowy.'],
['ZNAK OD LOSU','Zrób to. Jeśli nie wiesz co — tym bardziej brzmi ciekawie.'],
['PRAWDA','Masz więcej czasu, niż Ci się wydaje. I mniej, niż planujesz zmarnować.'],
['WRÓŻBA','Dziś trafisz na coś przypadkiem. Udawaj, że tak miało być.'],
['ZNAK OD LOSU','Napisz do tej osoby. Tak, do tej. Nie, nie potrzebujesz lepszego powodu.'],
['PRAWDA','To, że dobrze brzmi w Twojej głowie, nie znaczy jeszcze, że jest dobrym pomysłem.'],
['WRÓŻBA','Mały sukces jest blisko. Wielki też, tylko ma gorszy dojazd.'],
['ZNAK OD LOSU','Odpuść jedną rzecz, którą robisz tylko dlatego, że „wypada”.'],
['PRAWDA','Nie wszystko trzeba ogarniać. Czasem wystarczy nie pogorszyć.']
];
const canvas=document.getElementById('scratch');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const card=document.getElementById('card');
const fortuneEl=document.getElementById('fortune');
const categoryEl=document.getElementById('category');
const actions=document.getElementById('actions');
const hint=document.getElementById('hint');
const counter=document.getElementById('counter');
let drawing=false,last=null,revealed=false,count=0,current=null;

function fitCanvas(){
  const r=card.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);
  canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);
  canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function pick(){
  let next;
  do{next=fortunes[Math.floor(Math.random()*fortunes.length)]}while(current&&next[1]===current[1]&&fortunes.length>1);
  current=next;categoryEl.textContent=current[0];fortuneEl.textContent=current[1];
}
function coat(){
  const r=card.getBoundingClientRect();
  ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,r.width,r.height);
  const g=ctx.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#aeb3b7');g.addColorStop(.48,'#e7e7e7');g.addColorStop(1,'#969b9f');ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);
  ctx.fillStyle='rgba(255,255,255,.34)';
  for(let i=0;i<170;i++){const x=Math.random()*r.width,y=Math.random()*r.height,s=Math.random()*2.3+.4;ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.font='900 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ZDRAP MNIE',r.width/2,r.height/2-8);ctx.font='700 11px Arial';ctx.fillText('palcem albo myszką, jak człowiek',r.width/2,r.height/2+18);
  ctx.globalCompositeOperation='destination-out';
}
function reset(){revealed=false;drawing=false;last=null;actions.classList.remove('show');hint.style.display='block';pick();fitCanvas();coat();}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function scratchLine(a,b){
  ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=36;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,18,0,Math.PI*2);ctx.fill();
}
function erasedEnough(){
  const d=ctx.getImageData(0,0,canvas.width,canvas.height).data;let clear=0,total=0;const step=40*4;
  for(let i=3;i<d.length;i+=step){total++;if(d[i]<35)clear++}return clear/total>.42;
}
function reveal(){if(revealed)return;revealed=true;ctx.clearRect(0,0,canvas.width,canvas.height);actions.classList.add('show');hint.style.display='none';count++;counter.textContent='Zdrapane dzisiaj: '+count;burst();}
canvas.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);scratchLine(last,last)});
canvas.addEventListener('pointermove',e=>{if(!drawing||revealed)return;const p=pos(e);scratchLine(last,p);last=p;if(erasedEnough())reveal()});
canvas.addEventListener('pointerup',()=>{drawing=false;last=null;if(!revealed&&erasedEnough())reveal()});
canvas.addEventListener('pointercancel',()=>{drawing=false;last=null});
window.addEventListener('resize',()=>{if(!revealed){fitCanvas();coat()}});
document.getElementById('again').addEventListener('click',reset);
document.getElementById('share').addEventListener('click',async()=>{
  const text='ZdrapSe wyrzuciło mi: „'+current[1]+'”';
  try{if(navigator.share){await navigator.share({title:'ZdrapSe',text})}else{await navigator.clipboard.writeText(text);alert('Skopiowane. Teraz wyślij komuś i udawaj, że to przeznaczenie.')}}catch(e){}
});
function burst(){const chars=['✦','★','●','✹','✷'];const r=card.getBoundingClientRect();for(let i=0;i<14;i++){const s=document.createElement('span');s.className='confetti';s.textContent=chars[Math.floor(Math.random()*chars.length)];s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',((Math.random()-.5)*260)+'px');s.style.setProperty('--y',((Math.random()-.7)*260)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
reset();
</script>
</body>
</html>
