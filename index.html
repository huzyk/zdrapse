<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4efe7"><title>ZdrapSe — nie myśl, zdrap</title><style>:root{--bg:#f4efe7;--ink:#121212;--blue:#3157ff;--pink:#ff5ca8;--lemon:#f4ff6a;--muted:#6f6b66}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}.app{width:min(100%,560px);min-height:100dvh;margin:auto;padding:16px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:950;letter-spacing:-1.8px}.beta{font-size:10px;font-weight:900;padding:7px 10px;border:1.5px solid;border-radius:999px;background:var(--lemon)}.screen{display:none}.screen.active{display:flex;flex-direction:column}.home{flex:1;justify-content:center;padding:30px 0 70px}.kicker{font-size:11px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;color:var(--blue);margin-bottom:10px}h1{font-size:clamp(58px,16vw,86px);line-height:.86;letter-spacing:-5px;margin:0;font-weight:950}h1 em{font-style:normal;color:var(--pink)}.intro{font-size:17px;line-height:1.4;color:var(--muted);margin:20px 0 28px;max-width:430px}.launch{border:3px solid var(--ink);border-radius:20px;background:var(--pink);font:inherit;font-size:24px;font-weight:950;padding:20px 24px;box-shadow:7px 7px 0 var(--ink);cursor:pointer;width:100%}.launch:active{transform:translate(4px,4px);box-shadow:3px 3px 0}.sub{font-size:11px;text-align:center;color:var(--muted);font-weight:800;margin-top:14px}.game{padding-top:22px}.cat-label{font-size:10px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}.categories{display:flex;gap:7px;overflow-x:auto;padding:0 2px 13px 1px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.cat{flex:0 0 auto;border:1.5px solid var(--ink);border-radius:999px;background:#fff;padding:9px 11px;font:inherit;font-size:11px;font-weight:900;white-space:nowrap}.cat.active{background:var(--pink);box-shadow:2px 2px 0 var(--ink)}.cat.adult{background:#1b1b1b;color:#fff}.cat.adult.active{outline:3px solid var(--pink)}.card-shell{border:2px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--blue);background:#fff}.scratch-wrap{position:relative;width:100%;aspect-ratio:1.55;border-radius:25px;overflow:hidden}.fortune{position:absolute;inset:0;padding:28px 24px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:var(--lemon)}.category{font-size:10px;font-weight:900;letter-spacing:2px;margin-bottom:13px;padding:7px 9px;border:1.5px solid;border-radius:999px;background:#fff}.fortune-text{font-size:clamp(24px,6.5vw,36px);line-height:1.02;font-weight:950;letter-spacing:-1.6px}.stamp{position:absolute;right:17px;bottom:13px;font-size:11px;font-weight:900;color:var(--blue)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:3}.hint{padding:14px 3px 0;font-size:11px;font-weight:900;text-transform:uppercase;color:var(--muted)}.actions{display:none;gap:10px;margin-top:16px}.actions.show{display:grid;grid-template-columns:1.2fr 1fr}.btn{border:2px solid;border-radius:16px;background:#fff;font:inherit;font-weight:900;font-size:15px;padding:15px 12px;box-shadow:4px 4px 0}.btn.primary{background:var(--pink)}.home-link{border:0;background:none;font:inherit;font-size:11px;font-weight:850;color:var(--muted);margin:22px auto 0}.footer{margin-top:auto;padding:24px 0 8px;font-size:11px;color:var(--muted);text-align:center}.flake{position:fixed;z-index:99;pointer-events:none;border-radius:50%;background:#aaa;animation:flake .55s ease-out forwards}@keyframes flake{to{transform:translate(var(--dx),var(--dy));opacity:0}}@media(max-width:430px){.app{padding:14px}.home{padding-bottom:55px}.scratch-wrap{aspect-ratio:1.45}.actions.show{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div class="logo">ZdrapSe</div><div class="beta">BETA / ABSURD</div></div><section class="screen home active" id="home"><div class="kicker">Los już coś wymyślił</div><h1>Nie myśl.<br><em>Zdrap.</em></h1><p class="intro">Nie musisz nic wybierać. Kliknij i zobacz, co tym razem wylosował Ci internet.</p><button class="launch" id="launch">ZDRAP SE</button><div class="sub">losowa kategoria • bez 18+</div></section><section class="screen game" id="game"><div class="cat-label">Chcesz konkretnie? Wybierz kategorię:</div><div class="categories"><button class="cat active" data-cat="LOS">🎲 LOS</button><button class="cat" data-cat="DOBRA RADA">„DOBRA” RADA</button><button class="cat" data-cat="MOTYWACJA">MOTYWACJA</button><button class="cat" data-cat="OBRAŹ MNIE">OBRAŹ MNIE</button><button class="cat" data-cat="POGŁASZCZ MNIE">POGŁASZCZ MNIE</button><button class="cat" data-cat="TAK CZY NIE">TAK CZY NIE</button><button class="cat adult" data-cat="18+">🔞 18+</button></div><div class="card-shell"><section class="scratch-wrap" id="card"><div class="fortune"><div class="category" id="category"></div><div class="fortune-text" id="fortune"></div><div class="stamp">ZDRAPSE</div></div><canvas id="scratch"></canvas></section></div><div class="hint" id="hint">Przejedź palcem po zdrapce</div><div class="actions" id="actions"><button class="btn primary" id="again">Jeszcze raz</button><button class="btn" id="share">Wyślij komuś</button></div><button class="home-link" id="homeLink">← Strona główna</button></section><div class="footer">bez logowania • bez sensu, za to szybko</div></main><script>let fortunes=[],selectedCat='LOS',current=null,ready=false;const fallback=[{kategoria:'DOBRA RADA',tekst:'Odśwież stronę. Los zgubił bazę.',waga:1}];function parseCSV(t){const l=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),h=l.shift().split(';').map(x=>x.trim().toLowerCase());return l.map(line=>{const c=line.split(';'),o={};h.forEach((x,i)=>o[x]=(c[i]||'').trim());o.waga=Math.max(1,parseInt(o.waga||1)||1);return o}).filter(o=>o.tekst&&o.aktywny.toUpperCase()!=='NIE')}async function load(){try{let r=await fetch('teksty.csv?'+Date.now(),{cache:'no-store'});fortunes=parseCSV(await r.text());if(!fortunes.length)throw 0}catch(e){fortunes=fallback}ready=true}function pool(){let p=selectedCat==='LOS'?fortunes.filter(x=>x.kategoria!=='18+'):fortunes.filter(x=>x.kategoria===selectedCat);if(!p.length)p=fallback;let w=[];p.forEach(x=>{for(let i=0;i<x.waga;i++)w.push(x)});return w}function pick(){let p=pool(),n;do{n=p[Math.floor(Math.random()*p.length)]}while(current&&p.length>1&&n.tekst===current.tekst);current=n;category.textContent=n.kategoria;fortune.textContent=n.tekst}const home=document.getElementById('home'),game=document.getElementById('game'),canvas=document.getElementById('scratch'),ctx=canvas.getContext('2d',{willReadFrequently:true}),card=document.getElementById('card'),category=document.getElementById('category'),fortune=document.getElementById('fortune'),actions=document.getElementById('actions'),hint=document.getElementById('hint');let drawing=false,last=null,revealed=false,moves=0;const REVEAL_AT=.56;launch.onclick=()=>{selectedCat='LOS';document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.cat==='LOS'));home.classList.remove('active');game.classList.add('active');reset();scrollTo(0,0)};homeLink.onclick=()=>{game.classList.remove('active');home.classList.add('active');scrollTo(0,0)};document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{selectedCat=b.dataset.cat;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');reset()});function fit(){let r=card.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0)}function coat(){let r=card.getBoundingClientRect(),g=ctx.createLinearGradient(0,0,r.width,r.height);ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,r.width,r.height);g.addColorStop(0,'#777d83');g.addColorStop(.2,'#e0e3e5');g.addColorStop(.5,'#999fa5');g.addColorStop(.8,'#eff1f2');g.addColorStop(1,'#858b90');ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);ctx.fillStyle='#222';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 18px system-ui';ctx.fillText('ZDRAP SE',r.width/2,r.height/2-8);ctx.font='800 10px system-ui';ctx.fillText('TU JEST TWOJA WĄTPLIWA ODPOWIEDŹ',r.width/2,r.height/2+17);ctx.globalCompositeOperation='destination-out'}function reset(){revealed=false;moves=0;actions.classList.remove('show');hint.style.display='block';pick();requestAnimationFrame(()=>requestAnimationFrame(()=>{fit();coat()}))}function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function scratch(a,b){ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=58;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,29,0,Math.PI*2);ctx.fill();flake(b.x,b.y)}function pct(){let d=ctx.getImageData(0,0,canvas.width,canvas.height).data,c=0,n=0;for(let i=3;i<d.length;i+=160){n++;if(d[i]<40)c++}return c/n}function check(){if(++moves%4)return;if(pct()>REVEAL_AT)reveal()}function reveal(){if(revealed)return;revealed=true;ctx.clearRect(0,0,canvas.width,canvas.height);actions.classList.add('show');hint.style.display='none'}function flake(x,y){if(Math.random()>.6)return;let r=canvas.getBoundingClientRect(),f=document.createElement('i');f.className='flake';f.style.width=f.style.height=(Math.random()*4+2)+'px';f.style.left=r.left+x+'px';f.style.top=r.top+y+'px';f.style.setProperty('--dx',(Math.random()-.5)*35+'px');f.style.setProperty('--dy',Math.random()*30+10+'px');document.body.appendChild(f);setTimeout(()=>f.remove(),600)}canvas.onpointerdown=e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);scratch(last,last)};canvas.onpointermove=e=>{if(!drawing||revealed)return;let p=pos(e);scratch(last,p);last=p;check()};canvas.onpointerup=()=>{drawing=false;if(!revealed&&pct()>REVEAL_AT)reveal()};again.onclick=reset;share.onclick=async()=>{let t='ZdrapSe: „'+current.tekst+'”';try{if(navigator.share)await navigator.share({title:'ZdrapSe',text:t,url:location.href});else await navigator.clipboard.writeText(t+' '+location.href)}catch(e){}};load();</script></body></html>
